<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Hawk BTC</title>

  <style>
    /* RESET — remove all browser weirdness */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    header {
      width: 100%;
      padding: 40px;
      display: flex;
      align-items: center;
    }

    /* THIS IS THE IMPORTANT PART */
    .logo img {
      width: 320px;       /* ← CHANGE THIS SIZE */
      max-width: none;    /* ← KILLS ALL HIDDEN CONSTRAINTS */
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="Blue Hawk BTC Logo" />
    </div>
  </header>
</body>
</html>
