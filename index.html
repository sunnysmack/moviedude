<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Hawk BTC</title>

  <style>
    :root {
      --bg: #0b0f17;
      --panel: #0f141c;
      --line: rgba(255,255,255,0.08);
      --text-main: #f2f4f8;
      --text-muted: #b0b6bf;
      --blue: #2f80ed;
      --orange: #f2994a;
      --accent: var(--orange);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }

    /* =====================
       HEADER
    ====================== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: linear-gradient(
        to bottom,
        rgba(11,15,23,0.95),
        rgba(11,15,23,0.85)
      );
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    header .logo img {
      height: 36px;
    }

    header .nav-cta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 18px;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    header .nav-cta:hover {
      background: var(--accent);
      color: #0b0f17;
    }

       GLOBAL SECTIONS
    ====================== */

      padding: 140px 8%;

    }

      font-weight: 500;
